<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 | 브레인랩</title>
  <meta name="description" content="요청하신 페이지를 찾을 수 없습니다.">
  <meta name="robots" content="noindex">
  <!-- 404는 임의 경로에서 서빙되므로 외부 리소스 없이 자체 완결 (CSS 인라인) -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #3f4245; background: #fff; word-break: keep-all;
      min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
    }
    h1 { color: #26282a; font-size: clamp(1.35rem, 3.4vw, 1.9rem); margin: 12px 0; }
    p { color: #6b7075; margin-bottom: 28px; }
    .btn {
      display: inline-block; padding: 13px 26px; border-radius: 999px;
      font-weight: 700; text-decoration: none; color: #fff; background: #2eb5a5;
      box-shadow: 0 4px 14px rgba(46,181,165,.35);
    }
    .btn:hover { background: #1f9084; }
  </style>
</head>
<body>
  <main>
    <div style="font-size: 3rem;">🤔</div>
    <h1>이 페이지는 없네요.</h1>
    <p>브레인랩식으로 물어볼게요 — "그럼 어디로 가면 될까?"</p>
    <a class="btn" id="home-link" href="/">홈으로 가기</a>
  </main>
  <script>
    // 프로젝트 사이트(username.github.io/<repo>/)와 커스텀 도메인 모두에서 홈으로 가도록 계산
    (function () {
      var known = ["about","program","report","admission","partnership","kit","contact","css","js","images","files"];
      var seg = location.pathname.split("/")[1];
      var home = (seg && known.indexOf(seg) === -1) ? "/" + seg + "/" : "/";
      document.getElementById("home-link").setAttribute("href", home);
    })();
  </script>
</body>
</html>
